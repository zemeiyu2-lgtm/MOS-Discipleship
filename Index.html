<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MOS-DIS 内容管理后台 V1.0</title>
<style>
:root{--bg:#f6f4ef;--panel:#fff;--text:#2f3330;--muted:#7a807b;--line:#e5e2db;--primary:#315b4f;--soft:#edf2ee;--danger:#9c4d43;--warn:#96713b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.6 system-ui,-apple-system,"Microsoft YaHei",sans-serif}.app{display:grid;grid-template-columns:220px 1fr;min-height:100vh}.side{background:#fff;border-right:1px solid var(--line);padding:22px 14px}.brand{font-size:20px;font-weight:800;color:var(--primary);padding:8px 10px 20px}.nav button{display:block;width:100%;border:0;background:transparent;text-align:left;padding:11px 12px;border-radius:10px;margin:4px 0;color:var(--text);cursor:pointer}.nav button.active,.nav button:hover{background:var(--soft);color:var(--primary);font-weight:700}.main{padding:22px;max-width:1400px;width:100%}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.top h1{font-size:22px;margin:0}.btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:9px 13px;cursor:pointer}.btn.primary{background:var(--primary);color:#fff;border-color:var(--primary)}.btn.danger{color:var(--danger)}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}.kpi{font-size:26px;font-weight:800;margin-top:3px}.muted{color:var(--muted);font-size:12px}.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.bar input,.bar select{border:1px solid var(--line);border-radius:9px;padding:9px;background:#fff}.table{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:auto}.table table{width:100%;border-collapse:collapse;min-width:900px}.table th,.table td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top;text-align:left}.table th{font-size:12px;color:var(--muted);background:#faf9f6;position:sticky;top:0}.tag{display:inline-block;border-radius:999px;padding:3px 8px;font-size:11px;background:#eee}.tag.a{background:#e4f1e7;color:#24563a}.tag.b{background:#fbf2df;color:#75531f}.tag.c{background:#f7e5e2;color:#893f38}.row-actions{display:flex;gap:6px}.split{display:grid;grid-template-columns:1fr 1.4fr .8fr;gap:14px}.preview{background:#fbfaf7;border:1px solid var(--line);border-radius:12px;padding:18px}.preview h3{margin:0 0 8px}.section{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}.section h2{margin:0 0 12px;font-size:16px}.field{margin-bottom:12px}.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}.field textarea,.field input{width:100%;padding:9px;border:1px solid var(--line);border-radius:8px;font:inherit;background:#fff}.field textarea{min-height:76px;resize:vertical}.choice-grid{display:grid;grid-template-columns:1fr;gap:8px}.choice{padding:10px;border:1px solid var(--line);border-radius:9px;background:#fff}.footer-actions{display:flex;gap:8px;justify-content:flex-end}.empty{padding:50px;text-align:center;color:var(--muted)}
@media(max-width:1000px){.app{grid-template-columns:1fr}.side{position:static;border-right:0;border-bottom:1px solid var(--line)}.cards{grid-template-columns:repeat(2,1fr)}.split{grid-template-columns:1fr}.nav{display:flex;overflow:auto}.nav button{min-width:110px;text-align:center}}
</style>
</head>
<body>
<div class="app">
<aside class="side"><div class="brand">MOS-DIS<br><span class="muted">内容管理后台 V1.0</span></div><div class="nav">
<button data-view="dashboard" class="active">内容总览</button><button data-view="weeks">周管理</button><button data-view="days">日内容</button><button data-view="review">内容审核</button><button data-view="versions">版本记录</button><button data-view="publish">发布管理</button>
</div></aside>
<main class="main" id="app"></main>
</div>
<script>
const S={view:'dashboard',days:[],weeks:[],selected:null,versions:[]};
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function run(name,args=[],cb){google.script.run.withSuccessHandler(cb||render).withFailureHandler(e=>alert(e.message||e))[name](...args)}
function tag(s){const c=s==='A'?'a':s==='B'?'b':s==='C'?'c':'';return `<span class="tag ${c}">${esc(s||'')}</span>`}
function nav(view){S.view=view;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===view));render();}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>nav(b.dataset.view));
function load(){run('getDashboard',[],d=>{S.dashboard=d; render();});}
function render(){const root=document.getElementById('app'); if(S.view==='dashboard') return dashboard(root); if(S.view==='weeks') return weeks(root); if(S.view==='days') return days(root); if(S.view==='review') return review(root); if(S.view==='versions') return versions(root); if(S.view==='publish') return publish(root)}
function dashboard(root){const d=S.dashboard||{days:0,weeks:0,review:{},content:{},phases:{}};root.innerHTML=`<div class="top"><h1>内容总览</h1><button class="btn" onclick="load()">刷新</button></div><div class="cards"><div class="card"><div class="muted">每日单元</div><div class="kpi">${d.days}</div></div><div class="card"><div class="muted">周次</div><div class="kpi">${d.weeks}</div></div><div class="card"><div class="muted">待审核</div><div class="kpi">${d.review['待审核']||0}</div></div><div class="card"><div class="muted">已发布</div><div class="kpi">${d.content['已发布']||0}</div></div></div><div class="section"><h2>审核状态</h2><div class="bar">${Object.entries(d.review).map(([k,v])=>`<span class="tag">${esc(k)} ${v}</span>`).join('')}</div></div><div class="section"><h2>四阶段</h2><div class="cards">${Object.entries(d.phases).map(([k,v])=>`<div class="card"><div>${esc(k)}</div><div class="kpi">${v}</div><div class="muted">日</div></div>`).join('')}</div></div>`}
function weeks(root){run('getWeeks',[{}],rows=>{S.weeks=rows;root.innerHTML=`<div class="top"><h1>周管理</h1><button class="btn primary" onclick="importPrompt('weeks')">导入周内容</button></div><div class="bar"><input id="wq" placeholder="搜索主题/引导句" oninput="filterWeeks()"></div><div class="table"><table><thead><tr><th>周</th><th>阶段</th><th>主题</th><th>引导句</th><th>经文</th><th>审核</th><th>操作</th></tr></thead><tbody id="wt"></tbody></table></div>`;filterWeeks()})}
function filterWeeks(){const q=(document.getElementById('wq')?.value||'').toLowerCase();const rs=S.weeks.filter(r=>Object.values(r).some(v=>String(v||'').toLowerCase().includes(q)));document.getElementById('wt').innerHTML=rs.map(r=>`<tr><td>W${String(r.week).padStart(2,'0')}</td><td>${esc(r.season||'')}</td><td>${esc(r.sunday_theme||'')}</td><td>${esc(r.guide_sentence||'')}</td><td>${esc(r.reference||'')}</td><td>${tag(r.review_status)}</td><td><button class="btn" onclick="editWeek(${Number(r.week)})">编辑</button></td></tr>`).join('')||`<tr><td colspan="7" class="empty">暂无内容</td></tr>`}
function editWeek(w){run('getWeek',[w],r=>{const root=document.getElementById('app');root.innerHTML=`<div class="top"><h1>W${String(w).padStart(2,'0')}</h1><button class="btn" onclick="nav('weeks')">返回</button></div><div class="section"><h2>周级内容</h2>${field('主题','sunday_theme',r.sunday_theme)}${field('每周引导句','guide_sentence',r.guide_sentence)}${field('核心经文','reference',r.reference)}<div class="footer-actions"><button class="btn" onclick="saveWeek(${w})">保存</button><button class="btn" onclick="reviewWeek(${w},'A')">审核通过</button><button class="btn" onclick="reviewWeek(${w},'B')">小修</button><button class="btn" onclick="reviewWeek(${w},'C')">重写</button></div></div>`;S.currentWeek=r})}
function field(label,key,val){return `<div class="field"><label>${esc(label)}</label><textarea id="f_${key}">${esc(val||'')}</textarea></div>`}
function saveWeek(w){const p={week:w,sunday_theme:val('sunday_theme'),guide_sentence:val('guide_sentence'),reference:val('reference')};run('saveWeek',[p],()=>alert('已保存'))}
function reviewWeek(w,s){const note=prompt('审核备注（可留空）：',''); if(note===null)return;run('reviewWeek',[w,s,note],()=>{alert('已更新');nav('weeks')})}
function val(k){return document.getElementById('f_'+k)?.value||''}
function days(root){run('getDays',[{}],rows=>{S.days=rows;root.innerHTML=`<div class="top"><h1>日内容</h1><button class="btn primary" onclick="importPrompt('days')">导入364日</button></div><div class="bar"><select id="dw" onchange="filterDays()"><option value="">全部周</option>${Array.from({length:52},(_,i)=>`<option value="${i+1}">W${String(i+1).padStart(2,'0')}</option>`).join('')}</select><select id="ds" onchange="filterDays()"><option value="">全部状态</option><option>待审核</option><option>A</option><option>B</option><option>C</option></select><input id="dq" placeholder="搜索日ID/主题/经文" oninput="filterDays()"></div><div class="table"><table><thead><tr><th>日ID</th><th>周</th><th>日类型</th><th>核心</th><th>反思</th><th>审核</th><th>发布</th><th></th></tr></thead><tbody id="dt"></tbody></table></div>`;filterDays()})}
function filterDays(){const w=document.getElementById('dw')?.value||'',s=document.getElementById('ds')?.value||'',q=(document.getElementById('dq')?.value||'').toLowerCase();const rs=S.days.filter(r=>(!w||Number(r.week)===Number(w))&&(!s||r.review_status===s)&&Object.values(r).some(v=>String(v||'').toLowerCase().includes(q)));document.getElementById('dt').innerHTML=rs.map(r=>`<tr><td>${esc(r.day_id)}</td><td>W${String(r.week).padStart(2,'0')}</td><td>${esc(r.day_type||'')}</td><td>${esc(r.daily_core||'')}</td><td>${esc(r.question||'')}</td><td>${tag(r.review_status)}</td><td>${esc(r.content_status||'')}</td><td><button class="btn" onclick="editDay('${esc(r.day_id)}')">编辑</button></td></tr>`).join('')||`<tr><td colspan="8" class="empty">暂无内容</td></tr>`}
function editDay(id){run('getDay',[id],r=>{S.currentDay=r;const root=document.getElementById('app');root.innerHTML=`<div class="top"><h1>${esc(id)}</h1><button class="btn" onclick="nav('days')">返回</button></div><div class="split"><div><div class="section"><h2>上下文</h2><div class="muted">第${esc(r.week)}周 · ${esc(r.phase)} · ${esc(r.day_type)}</div><p><b>${esc(r.week_theme)}</b></p><p>${esc(r.week_guide)}</p><p>经文：${esc(r.reference)}</p></div><div class="section"><h2>审核</h2><div class="bar"><button class="btn" onclick="reviewDay('${id}','A')">A 可使用</button><button class="btn" onclick="reviewDay('${id}','B')">B 小修</button><button class="btn danger" onclick="reviewDay('${id}','C')">C 重写</button></div><div class="field"><label>审核备注</label><textarea id="review_note">${esc(r.review_note||'')}</textarea></div></div></div><div class="preview"><h3>${esc(r.day_type)}</h3><p><b>核心</b><br>${esc(r.daily_core)}</p><p><b>反思</b><br>${esc(r.question)}</p><p><b>选择</b></p><div class="choice-grid">${['option_a','option_b','option_c'].map(k=>`<div class="choice">${esc(r[k]||'')}</div>`).join('')}</div><p><b>实践</b><br>${esc(r.practice)}</p>${r.share?`<p><b>关系</b><br>${esc(r.share)}</p>`:''}${r.mission?`<p><b>使命</b><br>${esc(r.mission)}</p>`:''}</div><div><div class="section"><h2>编辑</h2>${field('核心','daily_core',r.daily_core)}${field('反思','question',r.question)}${field('选择A','option_a',r.option_a)}${field('选择B','option_b',r.option_b)}${field('选择C','option_c',r.option_c)}${field('实践','practice',r.practice)}${field('关系','share',r.share)}${field('使命','mission',r.mission)}<div class="footer-actions"><button class="btn primary" onclick="saveDay('${id}')">保存</button></div></div></div></div>`})}
function saveDay(id){const p={day_id:id,daily_core:val('daily_core'),question:val('question'),option_a:val('option_a'),option_b:val('option_b'),option_c:val('option_c'),practice:val('practice'),share:val('share'),mission:val('mission'),review_note:document.getElementById('review_note')?.value||''};run('saveDay',[p],()=>alert('已保存'))}
function reviewDay(id,s){const note=document.getElementById('review_note')?.value||'';run('reviewDay',[id,s,note],()=>{alert('审核状态已更新');editDay(id)})}
function review(root){run('getDays',[{review_status:'待审核'}],rows=>{root.innerHTML=`<div class="top"><h1>内容审核</h1><button class="btn" onclick="load()">刷新</button></div><div class="section"><div class="muted">待审核：${rows.length} 天</div></div><div class="table"><table><thead><tr><th>日ID</th><th>主题</th><th>核心</th><th>经文</th><th></th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(r.day_id)}</td><td>${esc(r.week_theme)}</td><td>${esc(r.daily_core)}</td><td>${esc(r.reference)}</td><td><button class="btn" onclick="editDay('${esc(r.day_id)}')">审核</button></td></tr>`).join('')||`<tr><td colspan="5" class="empty">没有待审核内容</td></tr>`}</tbody></table></div>`})}
function versions(root){const r=S.currentDay||S.currentWeek;if(!r)return root.innerHTML=`<div class="section"><div class="empty">先从“日内容”打开一个内容单元，再查看版本。</div></div>`;const type=r.day_id?'day':'week',id=r.day_id||r.week;run('getVersions',[type,id],rows=>{root.innerHTML=`<div class="top"><h1>版本记录｜${esc(id)}</h1><button class="btn" onclick="${type==='day'?`editDay('${id}')`:`editWeek(${id})`}">返回</button></div><div class="table"><table><thead><tr><th>版本</th><th>动作</th><th>时间</th><th>操作者</th><th></th></tr></thead><tbody>${rows.sort((a,b)=>String(b.updated_at).localeCompare(String(a.updated_at))).map((v,i)=>`<tr><td>${esc(v.version_no)}</td><td>${esc(v.action)}</td><td>${esc(v.updated_at)}</td><td>${esc(v.updated_by)}</td><td><button class="btn" onclick="alert(${JSON.stringify(v.snapshot_json)})">查看</button></td></tr>`).join('')}</tbody></table></div>`})}
function publish(root){run('getDays',[{content_status:'已发布'}],rows=>{root.innerHTML=`<div class="top"><h1>发布管理</h1></div><div class="section"><div class="muted">已发布：${rows.length} 天</div></div><div class="table"><table><thead><tr><th>日ID</th><th>主题</th><th>审核</th><th>发布时间</th><th></th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(r.day_id)}</td><td>${esc(r.week_theme)}</td><td>${tag(r.review_status)}</td><td>${esc(r.published_at||'')}</td><td><button class="btn" onclick="unpublish('${esc(r.day_id)}')">撤回</button></td></tr>`).join('')||`<tr><td colspan="5" class="empty">暂无已发布内容</td></tr>`}</tbody></table></div>`})}
function unpublish(id){if(!confirm('确定撤回？'))return;run('unpublishDay',[id],()=>{alert('已撤回');nav('publish')})}
function importPrompt(type){const t=prompt(type==='days'?'请粘贴CSV文本（首行为表头）':'请粘贴周CSV文本（首行为表头）');if(t===null)return;const rows=parseCSV(t);run(type==='days'?'importDays':'importWeeks',[rows],r=>{alert('导入完成：'+r.imported);load()})}
function parseCSV(text){const rows=[];let row=[],cell='',q=false;for(let i=0;i<text.length;i++){const c=text[i],n=text[i+1];if(c==='"'){if(q&&n==='"'){cell+='"';i++}else q=!q}else if(c===','&&!q){row.push(cell);cell=''}else if((c==='\n'||c==='\r')&&!q){if(c==='\r'&&n==='\n')i++;row.push(cell);if(row.some(x=>x!==''))rows.push(row);row=[];cell=''}else cell+=c}if(cell!==''||row.length){row.push(cell);if(row.some(x=>x!==''))rows.push(row)}if(rows.length<2)return[];const h=rows[0].map(x=>x.trim().replace(/^\uFEFF/,''));return rows.slice(1).map(r=>Object.fromEntries(h.map((k,i)=>[k,String(r[i]??'').trim()] )))}
load();
</script>
</body></html>
